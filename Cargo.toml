[package]
name = "mcpg-plugin-backend-graphql"
version = "0.1.0-alpha.15"
license = "Apache-2.0"
edition = "2024"
description = """
GraphQL backend binding plugin for mcpg. Dispatches tool calls as
GraphQL-over-HTTP POSTs (`{ query, variables }` JSON body) to an
operator-configured endpoint, reusing the shared net-core HTTP core
(per-cred reqwest client cache, DNS rebinding guard, per-call CEL +
cred:// resolution, body-limit truncation). Mirrors the http/grpc
first-party plugin shape; the main mcpg binary loads this crate at
runtime via the plugin registry and carries no inline GraphQL dispatch
code.
"""

[lib]
# cdylib: the .so the gateway's native_loader dlopens. rlib: in-tree
# unit tests + the eager new() constructor.
crate-type = ["cdylib", "rlib"]

[features]
default = []
cdylib-export = []
# Declared empty so the SDK macro's `register_static` accessor does not
# trip `unexpected_cfgs`. graphql is consumed as a cdylib.
static-firstparty = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
# Shared HTTP-over-reqwest core: NetworkProfileRuntime (per-cred client
# cache + DNS-rebinding guard + per-call CEL/cred:// resolution), the
# exec primitives, and the downstream-error retry shaping.
mcpg-plugin-backend-net-core = { git = "https://github.com/mcpg-dev/mcpg-plugin-backend-net-core", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
mcpg-plugin-sdk      = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13", features = ["static-firstparty"] }
mcpg-plugin-host     = { git = "https://github.com/mcpg-dev/mcpg-plugin-host", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
async-trait    = "0.1"
futures        = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
tokio          = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing        = "0.1"

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = "0.6"
